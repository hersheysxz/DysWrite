<svg width="680" height="650" viewBox="0 0 680 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="650" fill="#ffffff"/>

  <!-- Central process -->
  <circle cx="340" cy="320" r="85" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" font-weight="600" fill="#26215C">DysWrite: Mobile</text>
  <text x="340" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" font-weight="600" fill="#26215C">Dyslexia Detection</text>
  <text x="340" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" font-weight="600" fill="#26215C">System</text>
  <text x="340" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#3C3489">(MobileNetV3 transfer learning + XAI)</text>
  <text x="340" y="361" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">(Process 0)</text>

  <!-- Student entity (top) -->
  <rect x="270" y="30" width="140" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Student</text>

  <!-- Teacher entity (right) -->
  <rect x="500" y="295" width="130" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="565" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Teacher</text>

  <!-- Parent entity (bottom) -->
  <rect x="270" y="570" width="140" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Parent</text>

  <!-- Admin entity (left) -->
  <rect x="10" y="295" width="130" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="75" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Admin</text>

  <!-- Student <-> System -->
  <line x1="315" y1="80" x2="315" y2="240" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="365" y1="240" x2="365" y2="80" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="305" y="150" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#3d3d3a">Login, handwriting sample</text>
  <text x="375" y="195" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#3d3d3a">Writing task, instructions</text>

  <!-- Teacher <-> System -->
  <line x1="425" y1="305" x2="500" y2="305" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="500" y1="335" x2="425" y2="335" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="430" y="288" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#3d3d3a">Detection results, reports</text>
  <text x="430" y="355" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#3d3d3a">Student samples, requests</text>

  <!-- Parent <-> System -->
  <line x1="315" y1="405" x2="315" y2="570" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="365" y1="570" x2="365" y2="405" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="305" y="475" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#3d3d3a">Consent, login credentials</text>
  <text x="375" y="520" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#3d3d3a">Result notification</text>

  <!-- Admin <-> System -->
  <line x1="140" y1="305" x2="255" y2="305" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="255" y1="335" x2="140" y2="335" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="145" y="288" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#3d3d3a">Account, model config</text>
  <text x="145" y="355" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#3d3d3a">System logs, model reports</text>

</svg>
