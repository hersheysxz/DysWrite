<svg width="680" height="950" viewBox="0 0 680 950" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="950" fill="#ffffff"/>

  <!-- ===================== PROCESS CIRCLES ===================== -->
  <!-- 1.0 Manage accounts -->
  <circle cx="340" cy="120" r="70" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">1.0</text>
  <text x="340" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">Manage</text>
  <text x="340" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">accounts</text>

  <!-- 2.0 Capture and preprocess sample -->
  <circle cx="340" cy="340" r="70" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">2.0</text>
  <text x="340" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">Capture &amp;</text>
  <text x="340" y="349" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">preprocess</text>
  <text x="340" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">sample</text>

  <!-- 3.0 Run MobileNetV3 inference (Transfer Learning + XAI) -->
  <circle cx="340" cy="560" r="70" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">3.0</text>
  <text x="340" y="547" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#26215C">Run MobileNetV3</text>
  <text x="340" y="564" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#26215C">inference &amp;</text>
  <text x="340" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#26215C">explanation</text>
  <text x="340" y="597" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3C3489">(transfer learning)</text>

  <!-- 4.0 Generate report -->
  <circle cx="340" cy="780" r="70" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">4.0</text>
  <text x="340" y="782" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">Generate</text>
  <text x="340" y="800" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">report</text>

  <!-- ===================== DATA STORES ===================== -->
  <!-- D1 Accounts -->
  <rect x="490" y="95" width="120" height="50" fill="#E1F5EE" stroke="none"/>
  <line x1="490" y1="95" x2="490" y2="145" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="490" y1="95" x2="610" y2="95" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="490" y1="145" x2="610" y2="145" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="550" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#04342C">D1</text>
  <text x="550" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#085041">Accounts</text>

  <!-- D2 Handwriting samples -->
  <rect x="490" y="315" width="120" height="50" fill="#E1F5EE" stroke="none"/>
  <line x1="490" y1="315" x2="490" y2="365" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="490" y1="315" x2="610" y2="315" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="490" y1="365" x2="610" y2="365" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="550" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#04342C">D2</text>
  <text x="550" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#085041">Handwriting samples</text>

  <!-- D3 Preprocessed data -->
  <rect x="490" y="425" width="120" height="50" fill="#E1F5EE" stroke="none"/>
  <line x1="490" y1="425" x2="490" y2="475" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="490" y1="425" x2="610" y2="425" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="490" y1="475" x2="610" y2="475" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="550" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#04342C">D3</text>
  <text x="550" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#085041">Preprocessed data</text>

  <!-- D4 Reports -->
  <rect x="490" y="755" width="120" height="50" fill="#E1F5EE" stroke="none"/>
  <line x1="490" y1="755" x2="490" y2="805" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="490" y1="755" x2="610" y2="755" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="490" y1="805" x2="610" y2="805" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="550" y="774" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#04342C">D4</text>
  <text x="550" y="792" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#085041">Reports</text>

  <!-- ===================== EXTERNAL ENTITIES ===================== -->
  <!-- Admin -->
  <rect x="20" y="95" width="120" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="80" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Admin</text>

  <!-- Student -->
  <rect x="20" y="315" width="120" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="80" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Student</text>

  <!-- Teacher -->
  <rect x="20" y="640" width="120" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="80" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Teacher</text>

  <!-- Parent -->
  <rect x="20" y="755" width="120" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="80" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Parent</text>

  <!-- ===================== CONNECTORS ===================== -->

  <!-- Admin <-> 1.0 -->
  <line x1="140" y1="112" x2="270" y2="112" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="270" y1="128" x2="140" y2="128" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="150" y="103" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Account setup</text>
  <text x="150" y="150" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Confirmation</text>

  <!-- 1.0 <-> D1 -->
  <line x1="410" y1="112" x2="490" y2="112" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="490" y1="128" x2="410" y2="128" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="415" y="103" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Write</text>
  <text x="415" y="150" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Read</text>

  <!-- 1.0 -> 2.0 -->
  <line x1="340" y1="190" x2="340" y2="270" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="350" y="234" font-family="Arial, sans-serif" font-size="12" fill="#3d3d3a">Verified login</text>

  <!-- Student <-> 2.0 -->
  <line x1="140" y1="332" x2="270" y2="332" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="270" y1="348" x2="140" y2="348" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="150" y="323" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Handwriting sample</text>
  <text x="150" y="368" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Writing task</text>

  <!-- 2.0 <-> D2 -->
  <line x1="410" y1="332" x2="490" y2="332" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="490" y1="348" x2="410" y2="348" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="415" y="323" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Store image</text>
  <text x="415" y="368" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Retrieve</text>

  <!-- 2.0 -> D3 (bent path) -->
  <path d="M410 355 L455 355 L455 450 L488 450" fill="none" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="365" y="400" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Preprocessed image</text>

  <!-- D3 -> 3.0 (bent path) -->
  <path d="M488 465 L470 465 L470 550 L410 550" fill="none" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="365" y="500" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Retrieve for model</text>

  <!-- 3.0 -> 4.0 -->
  <line x1="340" y1="630" x2="340" y2="710" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="350" y="674" font-family="Arial, sans-serif" font-size="12" fill="#3d3d3a">Detection result &amp; explanation</text>

  <!-- 4.0 <-> D4 -->
  <line x1="410" y1="772" x2="490" y2="772" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="490" y1="788" x2="410" y2="788" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="415" y="763" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Store report</text>
  <text x="415" y="808" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Retrieve</text>

  <!-- Teacher -> 4.0 -->
  <line x1="140" y1="665" x2="290" y2="735" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="285" y1="750" x2="140" y2="680" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="150" y="655" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Report request</text>
  <text x="150" y="700" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Detection report</text>

  <!-- Parent <-> 4.0 -->
  <line x1="140" y1="772" x2="270" y2="772" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="270" y1="788" x2="140" y2="788" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="150" y="763" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Consent form</text>
  <text x="150" y="808" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Notification</text>

</svg>
