<svg width="700" height="1030" viewBox="0 0 700 1030" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="1030" fill="#ffffff"/>

  <!-- Boundary of the expanded 3.0 process -->
  <rect x="250" y="78" width="400" height="850" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="262" y="98" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Process 3.0 expanded (MobileNetV3 inference + XAI)</text>

  <!-- D3 Preprocessed data (external, incoming - matches Level 1) -->
  <rect x="280" y="20" width="120" height="50" fill="#E1F5EE" stroke="none"/>
  <line x1="280" y1="20" x2="280" y2="70" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="280" y1="20" x2="400" y2="20" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="280" y1="70" x2="400" y2="70" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="340" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#04342C">D3</text>
  <text x="340" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#085041">Preprocessed data</text>

  <line x1="340" y1="70" x2="340" y2="88" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="350" y="83" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Retrieve for model</text>

  <!-- ===================== SUB-PROCESSES ===================== -->
  <!-- 3.1 Extract handwriting features -->
  <circle cx="340" cy="165" r="65" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">3.1</text>
  <text x="340" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">Extract</text>
  <text x="340" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">handwriting</text>
  <text x="340" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">features</text>

  <!-- 3.2 Run MobileNetV3 classification (transfer learning) -->
  <circle cx="340" cy="385" r="65" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">3.2</text>
  <text x="340" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#26215C">Run MobileNetV3</text>
  <text x="340" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#26215C">classification</text>
  <text x="340" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3C3489">(transfer learning)</text>

  <!-- 3.3 Generate XAI explanation -->
  <circle cx="340" cy="605" r="65" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">3.3</text>
  <text x="340" y="598" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">Generate XAI</text>
  <text x="340" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">explanation</text>
  <text x="340" y="631" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3C3489">(Grad-CAM)</text>

  <!-- 3.4 Compile detection result & explanation -->
  <circle cx="340" cy="825" r="65" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="801" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">3.4</text>
  <text x="340" y="818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#26215C">Compile result &amp;</text>
  <text x="340" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#26215C">explanation</text>

  <!-- ===================== INTERNAL DATA STORES ===================== -->
  <!-- D5 Extracted feature maps -->
  <rect x="510" y="275" width="120" height="50" fill="#E1F5EE" stroke="none"/>
  <line x1="510" y1="275" x2="510" y2="325" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="510" y1="275" x2="630" y2="275" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="510" y1="325" x2="630" y2="325" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="570" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#04342C">D5</text>
  <text x="570" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#085041">Feature maps</text>

  <!-- D6 Classification output -->
  <rect x="510" y="495" width="120" height="60" fill="#E1F5EE" stroke="none"/>
  <line x1="510" y1="495" x2="510" y2="555" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="510" y1="495" x2="630" y2="495" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="510" y1="555" x2="630" y2="555" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="570" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#04342C">D6</text>
  <text x="570" y="534" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#085041">Classification</text>
  <text x="570" y="549" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#085041">output</text>

  <!-- D7 Explanation map -->
  <rect x="510" y="715" width="120" height="50" fill="#E1F5EE" stroke="none"/>
  <line x1="510" y1="715" x2="510" y2="765" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="510" y1="715" x2="630" y2="715" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="510" y1="765" x2="630" y2="765" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="570" y="734" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#04342C">D7</text>
  <text x="570" y="752" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#085041">Explanation map</text>

  <!-- ===================== CONNECTORS ===================== -->

  <!-- 3.1 -> D5 (write feature map) -->
  <path d="M405 165 L450 165 L450 300 L508 300" fill="none" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="380" y="250" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Feature map</text>

  <!-- D5 -> 3.2 (read feature map) -->
  <path d="M508 315 L480 315 L480 385 L405 385" fill="none" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 3.2 -> D6 (write classification + confidence) -->
  <path d="M405 400 L470 400 L470 518 L508 518" fill="none" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="378" y="465" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Class + confidence</text>

  <!-- D5 -> 3.3 (read feature map for Grad-CAM) -->
  <path d="M508 290 L495 290 L495 590 L405 590" fill="none" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- D6 -> 3.3 (read predicted class) -->
  <path d="M508 528 L488 528 L488 615 L405 615" fill="none" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 3.3 -> D7 (write explanation map) -->
  <path d="M405 630 L465 630 L465 738 L508 738" fill="none" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="378" y="685" font-family="Arial, sans-serif" font-size="11" fill="#3d3d3a">Heatmap overlay</text>

  <!-- D6 -> 3.4 (read classification result) -->
  <path d="M508 540 L440 540 L440 810 L405 810" fill="none" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- D7 -> 3.4 (read explanation map) -->
  <path d="M508 745 L460 745 L460 825 L405 825" fill="none" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 3.4 -> 4.0 (external, boundary output - matches Level 1) -->
  <line x1="340" y1="890" x2="340" y2="948" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="350" y="920" font-family="Arial, sans-serif" font-size="12" fill="#3d3d3a">Detection result</text>

  <!-- External reference: 4.0 Generate report -->
  <rect x="280" y="950" width="120" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="340" y="970" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C2C2A">4.0</text>
  <text x="340" y="986" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Generate report</text>

</svg>
